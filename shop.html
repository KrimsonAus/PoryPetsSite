<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="styles.css">
    <!-- Import the Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<iframe id="top-panel" frameborder="none" src="header.html"  width="100%" height="auto"></iframe>

<main class="center-text">

    <div style="display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;">
        <div style="visibility: hidden; z-index: 99;" class="purchaseSuccessPanel" id="purchase-success-panel">
            <img src="PC.gif" alt="">
            <h1>Purchase Success!</h1>
        </div>
    </div>
    
  <div style="display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;">
    <div style="visibility: hidden; z-index: 99;" class="tutorialPanel" id="buy-pet-menu">
      <h1>Name and Buy your pet.</h1>
      <p id="buy-pet-what-pet">You are buying a .</p>
      <label>
        Display Name:
        <br>
        <input type="text" id="pet-name-input">
      </label>
      <br>
      <p style="color: red" id="pet-menu-status"></p>
      <br>
      <button id="buy-pet-button">Buy Pet</button>
      <button id="cancel-buy-pet-button">Cancel</button>
    </div>
  </div>

    <h1>Shop</h1>
    <br>
    <button class="shopButtons" onclick="changeShopCategory(0)">Toys</button>
    <button class="shopButtons" onclick="changeShopCategory(1)">Food</button>
    <button class="shopButtons" onclick="changeShopCategory(2)">Pets</button>

    <p id="shopLoad">Loading Shop....</p>
    <div class="shopItems">
    </div>
</main>
<footer></footer>
</body>
<script src="script.js"></script>

</html>
